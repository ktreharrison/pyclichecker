[project]
name = "pyclichecker"
version = "2.4.2"
description = "A high-signal Python linter for defects common in rushed and AI-generated code"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ken Harrison" },
]
keywords = ["ai", "ast", "code-quality", "linter", "python"]
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/ktreharrison/pyclichecker"
Repository = "https://github.com/ktreharrison/pyclichecker"
Issues = "https://github.com/ktreharrison/pyclichecker/issues"
Changelog = "https://github.com/ktreharrison/pyclichecker/blob/main/CHANGELOG.md"

[project.scripts]
pyclichecker = "pyclichecker.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = [
    ".github/**",
    "AGENTS.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "skills/**",
    "tests/**",
    "uv.lock",
]

[dependency-groups]
dev = [
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]
