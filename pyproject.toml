[project]
name = "pyclichecker"
version = "2.4.3"
description = "A high-signal Python linter for behavioral defects and maintainability risks"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ken Harrison" },
]
keywords = ["ai", "ast", "code-quality", "linter", "python"]
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/ktreharrison/pyclichecker"
Repository = "https://github.com/ktreharrison/pyclichecker"
Issues = "https://github.com/ktreharrison/pyclichecker/issues"
Changelog = "https://github.com/ktreharrison/pyclichecker/blob/main/CHANGELOG.md"

[project.scripts]
pyclichecker = "pyclichecker.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = [
    ".github/**",
    "AGENTS.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "docs/**",
    "LICENSE",
    "skills/**",
    "tests/**",
    "uv.lock",
]

[dependency-groups]
dev = [
    "bandit[toml]>=1.9.4",
    "coverage[toml]>=7.16.1",
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pyright>=1.1.414",
    "ruff>=0.16.3",
    "ty>=0.0.82",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["B", "C90", "DTZ", "E4", "E7", "E9", "F", "I", "PERF", "S", "UP"]

[tool.ruff.lint.mccabe]
max-complexity = 14

[tool.mypy]
files = ["src/pyclichecker"]
python_version = "3.14"
strict = true

[tool.coverage.run]
branch = true
source = ["pyclichecker"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
