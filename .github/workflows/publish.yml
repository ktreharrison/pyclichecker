name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
          python-version: "3.14"
          enable-cache: false

      - name: Install locked development environment
        run: uv sync --locked

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          project_version="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$RELEASE_TAG" = "v$project_version"

      - name: Run quality gates
        run: |
          uv run coverage erase
          uv run coverage run -m unittest discover -v
          uv run coverage report
          uv run python -m tests.corpus_runner
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run bandit -q -r src
          uv export --quiet --locked --all-groups --no-emit-project --format requirements.txt --output-file .audit-requirements.txt
          uv run pip-audit --strict --requirement .audit-requirements.txt
          uv run pyclichecker src tests

      - name: Build distributions
        run: uv build

      - name: Inspect archives
        run: |
          for archive in dist/*.whl; do
            uv run python -m zipfile -l "$archive"
          done
          for archive in dist/*.tar.gz; do
            tar -tzf "$archive"
          done

      - name: Smoke-test built wheel
        run: |
          repo_root="$PWD"
          wheel="$repo_root/dist/pyclichecker-${RELEASE_TAG#v}-py3-none-any.whl"
          scratch="$(mktemp -d)"
          cd "$scratch"
          uvx --from "$wheel" pyclichecker --version
          uvx --from "$wheel" pyclichecker --list-rules
          uvx --from "$wheel" pyclichecker "$repo_root/src" "$repo_root/tests"
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish
    if: github.event.release.prerelease == false
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: pypi
      url: https://pypi.org/p/pyclichecker
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
          enable-cache: false

      - name: Publish distributions
        run: >-
          uv publish
          --trusted-publishing always
          --check-url https://pypi.org/simple

  verify-index:
    name: Verify public installation
    if: github.event.release.prerelease == false
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
          python-version: "3.14"
          enable-cache: false

      - name: Verify no-cache installation from PyPI
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          expected="pyclichecker $version"
          for attempt in 1 2 3 4 5; do
            if output="$(
              uvx \
                --no-cache \
                --python 3.14 \
                --default-index https://pypi.org/simple \
                --from "pyclichecker==$version" \
                pyclichecker --version 2>&1
            )"; then
              printf '%s\n' "$output"
              if printf '%s\n' "$output" | grep -Fx "$expected"; then
                uvx \
                  --no-cache \
                  --python 3.14 \
                  --default-index https://pypi.org/simple \
                  --from "pyclichecker==$version" \
                  pyclichecker --list-rules
                exit 0
              fi
            else
              printf '%s\n' "$output"
            fi
            sleep 10
          done
          echo "PyPI did not serve $expected after 5 attempts" >&2
          exit 1
