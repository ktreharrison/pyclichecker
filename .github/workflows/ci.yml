name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python 3.14 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: "3.14"
          enable-cache: true

      - name: Install locked development environment
        run: uv sync --locked

      - name: Run unit tests
        run: uv run python -m unittest discover -v

      - name: Run Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run pyclichecker on itself
        run: uv run pyclichecker src tests

      - name: Build distributions
        run: uv build

      - name: Locate built wheel
        id: wheel
        shell: python
        run: |
          import os
          from pathlib import Path

          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected one wheel, found {len(wheels)}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"path={wheels[0].as_posix()}", file=output)

      - name: Smoke-test built wheel
        run: |
          uvx --from "${{ steps.wheel.outputs.path }}" pyclichecker --version
          uvx --from "${{ steps.wheel.outputs.path }}" pyclichecker src tests
