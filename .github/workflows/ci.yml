name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.5"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install locked development environment
        run: uv sync --locked

      - name: Run unit tests with branch coverage
        run: |
          uv run coverage erase
          uv run coverage run -m unittest discover -v
          uv run coverage report

      - name: Run differential corpus
        run: uv run python -m tests.corpus_runner

      - name: Run Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run strict type checking
        run: uv run mypy

      - name: Run security checks
        run: |
          uv run bandit -q -r src
          uv export --quiet --locked --all-groups --no-emit-project --format requirements.txt --output-file .audit-requirements.txt
          uv run pip-audit --strict --requirement .audit-requirements.txt

      - name: Run pyclichecker on itself
        run: uv run pyclichecker src tests

      - name: Build distributions
        run: uv build

      - name: Locate built wheel
        id: wheel
        shell: python
        run: |
          import os
          from pathlib import Path

          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected one wheel, found {len(wheels)}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"path={wheels[0].as_posix()}", file=output)

      - name: Smoke-test built wheel
        shell: python
        env:
          WHEEL_PATH: ${{ steps.wheel.outputs.path }}
        run: |
          import os
          import subprocess

          wheel = os.environ["WHEEL_PATH"]
          subprocess.run(
              ["uvx", "--from", wheel, "pyclichecker", "--version"],
              check=True,
          )
          subprocess.run(
              ["uvx", "--from", wheel, "pyclichecker", "src", "tests"],
              check=True,
          )
